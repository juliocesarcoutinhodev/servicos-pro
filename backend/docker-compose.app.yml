services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: servicepro-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: ${SERVER_PORT:-8080}
      MANAGEMENT_SERVER_PORT: ${MANAGEMENT_SERVER_PORT:-8081}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-servicepro}
      DB_USERNAME: ${POSTGRES_USER:-servicepro}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-servicepro}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      JWT_ISSUER: ${JWT_ISSUER:-servicepro}
      JWT_ACCESS_TOKEN_TTL_SECONDS: ${JWT_ACCESS_TOKEN_TTL_SECONDS:-900}
      JWT_REFRESH_TOKEN_TTL_SECONDS: ${JWT_REFRESH_TOKEN_TTL_SECONDS:-604800}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:19006}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-}
      APP_CORS_ALLOWED_METHODS: ${APP_CORS_ALLOWED_METHODS:-GET,POST,PUT,PATCH,DELETE,OPTIONS}
      APP_CORS_ALLOWED_HEADERS: ${APP_CORS_ALLOWED_HEADERS:-Authorization,Content-Type,X-Requested-With,Origin,Accept}
      APP_CORS_EXPOSED_HEADERS: ${APP_CORS_EXPOSED_HEADERS:-X-RateLimit-Limit,X-RateLimit-Remaining,X-RateLimit-Reset,Retry-After}
      APP_CORS_ALLOW_CREDENTIALS: ${APP_CORS_ALLOW_CREDENTIALS:-true}
      APP_CORS_MAX_AGE_SECONDS: ${APP_CORS_MAX_AGE_SECONDS:-3600}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
