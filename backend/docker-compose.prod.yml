services:
  postgres:
    image: postgres:17
    container_name: servicepro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - servicepro

  redis:
    image: redis:8-alpine
    container_name: servicepro-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${REDIS_PASSWORD:?REDIS_PASSWORD is required} ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
    networks:
      - servicepro

  app:
    image: ${APP_IMAGE}
    container_name: servicepro-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SERVER_PORT: ${SERVER_PORT}
      MANAGEMENT_SERVER_PORT: ${MANAGEMENT_SERVER_PORT}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_ACCESS_TOKEN_TTL_SECONDS: ${JWT_ACCESS_TOKEN_TTL_SECONDS}
      JWT_REFRESH_TOKEN_TTL_SECONDS: ${JWT_REFRESH_TOKEN_TTL_SECONDS}
      AUTH_RATE_LIMIT_MAX_REQUESTS_PER_WINDOW: ${AUTH_RATE_LIMIT_MAX_REQUESTS_PER_WINDOW}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS}
      AUTH_PASSWORD_RESET_TOKEN_TTL_SECONDS: ${AUTH_PASSWORD_RESET_TOKEN_TTL_SECONDS}
      AUTH_LOGIN_URL: ${AUTH_LOGIN_URL}
      AUTH_RESET_PASSWORD_URL: ${AUTH_RESET_PASSWORD_URL}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS}
      APP_CORS_ALLOWED_METHODS: ${APP_CORS_ALLOWED_METHODS}
      APP_CORS_ALLOWED_HEADERS: ${APP_CORS_ALLOWED_HEADERS}
      APP_CORS_EXPOSED_HEADERS: ${APP_CORS_EXPOSED_HEADERS}
      APP_CORS_ALLOW_CREDENTIALS: ${APP_CORS_ALLOW_CREDENTIALS}
      APP_CORS_MAX_AGE_SECONDS: ${APP_CORS_MAX_AGE_SECONDS}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED}
      APP_MAIL_HOST: ${APP_MAIL_HOST}
      APP_MAIL_PORT: ${APP_MAIL_PORT}
      APP_MAIL_USERNAME: ${APP_MAIL_USERNAME}
      APP_MAIL_FROM: ${APP_MAIL_FROM}
      APP_MAIL_PASSWORD: ${APP_MAIL_PASSWORD}
      APP_MAIL_SMTP_AUTH: ${APP_MAIL_SMTP_AUTH}
      APP_MAIL_SMTP_STARTTLS_ENABLE: ${APP_MAIL_SMTP_STARTTLS_ENABLE}
      APP_MAIL_SMTP_SSL_ENABLE: ${APP_MAIL_SMTP_SSL_ENABLE}
      APP_MAIL_SMTP_CONNECTIONTIMEOUT: ${APP_MAIL_SMTP_CONNECTIONTIMEOUT}
      APP_MAIL_SMTP_TIMEOUT: ${APP_MAIL_SMTP_TIMEOUT}
      APP_MAIL_SMTP_WRITETIMEOUT: ${APP_MAIL_SMTP_WRITETIMEOUT}
      APP_MAIL_DEBUG: ${APP_MAIL_DEBUG}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${SERVER_PORT}:8080"
      - "127.0.0.1:${MANAGEMENT_SERVER_PORT}:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      - servicepro

volumes:
  postgres_data:
  redis_data:

networks:
  servicepro:
    name: servicepro-network
