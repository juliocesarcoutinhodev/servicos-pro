spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/servicepro}
    username: ${DB_USERNAME:servicepro}
    password: ${DB_PASSWORD:servicepro}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    org.springframework.security: INFO
